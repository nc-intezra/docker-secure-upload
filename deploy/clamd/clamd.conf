# clamd settings for the diode upload service. See README.md for why each limit
# is set as it is. CLAMD_MAX_SCAN_SIZE in compose.yaml must match MaxScanSize.

# No LogFile: clamd refuses to open a log file through a symlink, and
# /dev/stdout is one inside a container ("Symbolic link loop"). Running in
# the foreground, clamd writes its log to the container output instead.
Foreground yes
LogTime yes
LogClean no
LogVerbose no

# No TCPAddr: listen on every address (IPv4 and IPv6) inside the container.
# Only the internal scan network can reach it; no port is published.
TCPSocket 3310
# The image's unprivileged entrypoint waits for this socket to appear.
LocalSocket /tmp/clamd.sock
DatabaseDirectory /var/lib/clamav

MaxThreads 4
MaxQueue 100
ReadTimeout 300
CommandReadTimeout 30
SelfCheck 600
ConcurrentDatabaseReload yes

# ClamAV cannot scan single files over about 4 GB. Set the limits as high as
# it allows and make it report what it skipped instead of answering OK.
MaxFileSize 4000M
MaxScanSize 4000M
StreamMaxLength 4000M
AlertExceedsMax yes

# Archive-bomb limits. Hitting one is reported as
# Heuristics.Limits.Exceeded.* and the app holds the file for review.
MaxRecursion 17
MaxFiles 10000
MaxScanTime 3600000

# Encrypted archives and documents cannot be inspected; report them.
AlertEncrypted yes

ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanPE yes
ScanELF yes
