# freshclam settings for the diode upload service.
#
# The same as the image's own file except that there is no UpdateLogFile:
# freshclam runs with --stdout, so its log goes to the container output and
# is rotated with it. A log file would need a writable, clamav-owned folder,
# which the read-only clamd container does not have.
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes
NotifyClamd /etc/clamav/clamd.conf
