# Reverse proxy for the user upload site (nginx-unprivileged image).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes_in":$request_length,'
                                '"bytes_out":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout json;

    # Coarse per-IP limits; the app enforces the detailed ones.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    upstream app {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/upload.crt;
        ssl_certificate_key /etc/nginx/tls/upload.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        client_header_timeout 10s;
        client_body_timeout   60s;  # max gap between body reads, not total time
        send_timeout          60s;
        keepalive_timeout     30s;
        client_max_body_size  16k;  # JSON API; uploads get their own limit below
        limit_conn conns 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the app trusts this only from this proxy
        proxy_set_header X-Forwarded-For "";

        # tus chunks: CHUNK_SIZE (64 MiB) + 1 MiB. Streamed straight through,
        # never spooled to disk here. Not under limit_req: byte limits in the
        # app bound these.
        location /api/v1/uploads/ {
            client_max_body_size 65m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://app;
        }

        location / {
            limit_req zone=perip burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://app;
        }
    }
}
